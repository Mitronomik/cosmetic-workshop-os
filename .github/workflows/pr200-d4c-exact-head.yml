name: PR200 D4-C exact-head verifier

on:
  push:
    branches:
      - verification/pr200-ba577f11

permissions:
  contents: read

env:
  EXPECTED_BASE: 20d7190ebd91012a58993bf02934d6f4459332a0
  EXPECTED_HEAD: ba577f1151e041c11019525862d9bb76eeb1404e
  PR_BRANCH: agent/d4-c-user-update-status-failure-ux
  VERIFIER_BRANCH: verification/pr200-ba577f11

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 55
    steps:
      - name: Checkout exact published PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Run external Level-5 verifier
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$VERIFIER_BRANCH"
          git show "origin/$VERIFIER_BRANCH:verification/pr200_level5.py" > "$RUNNER_TEMP/pr200_level5.py"
          python3 -m py_compile "$RUNNER_TEMP/pr200_level5.py"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 "$RUNNER_TEMP/pr200_level5.py"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr200-d4c-ba577f11-evidence
          path: ${{ runner.temp }}/pr200-ba577f11-evidence
          if-no-files-found: error
