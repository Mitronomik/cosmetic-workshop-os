name: D4-B stage ownership fix runner

on:
  push:
    branches:
      - maintenance/d4-b-stage-ownership-fix-runner

permissions:
  contents: write

env:
  EXPECTED_HEAD: dfae82160095700ae1056236083e41a8b5817ca7
  TARGET_BRANCH: agent/d4-b-staged-update-safety

jobs:
  repair:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Exact-head preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git diff --check
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply bounded ownership repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          service = Path('backend/app/services/update_safety.py')
          text = service.read_text(encoding='utf-8')

          old = '''    backup: BackupResult | None = None\n    committed = False\n'''
          new = '''    backup: BackupResult | None = None\n    stage_owned = False\n    committed = False\n'''
          if text.count(old) != 1:
              raise SystemExit('stage ownership state insertion did not match exactly once')
          text = text.replace(old, new)

          old = '''        _create_consistent_stage_snapshot(config.path, stage_path)\n        _verify_database(\n'''
          new = '''        _create_consistent_stage_snapshot(config.path, stage_path)\n        stage_owned = True\n        _verify_database(\n'''
          if text.count(old) != 1:
              raise SystemExit('stage ownership acquisition did not match exactly once')
          text = text.replace(old, new)

          old = '''        _cleanup_owned_stage_artifacts(config.path, operation_id)\n'''
          new = '''        if stage_owned:\n            _cleanup_owned_stage_artifacts(config.path, operation_id)\n'''
          if text.count(old) != 2:
              raise SystemExit(f'expected two execution cleanup calls, got {text.count(old)}')
          text = text.replace(old, new)
          service.write_text(text, encoding='utf-8')

          tests = Path('backend/app/tests/test_d4_b_update_safety.py')
          text = tests.read_text(encoding='utf-8')
          anchor = '''def test_staged_migration_failure_keeps_canonical_unchanged(tmp_path, monkeypatch):\n'''
          addition = '''def test_preexisting_stage_collision_is_preserved(tmp_path, monkeypatch):\n    paths = build_user_prefix(tmp_path, monkeypatch)\n    operation_id = \"a\" * 32\n    stage = _stage_path(paths.database_path, operation_id)\n    stage.parent.mkdir(parents=True, exist_ok=True)\n    stage_bytes = b\"preexisting stage must survive\"\n    stage.write_bytes(stage_bytes)\n    sidecars = [\n        stage.parent / f\"{stage.name}-wal\",\n        stage.parent / f\"{stage.name}-shm\",\n        stage.parent / f\"{stage.name}-journal\",\n    ]\n    sidecar_bytes = {}\n    for index, sidecar in enumerate(sidecars):\n        payload = f\"preexisting-sidecar-{index}\".encode()\n        sidecar.write_bytes(payload)\n        sidecar_bytes[sidecar] = payload\n\n    class FixedUuid:\n        hex = operation_id\n\n    monkeypatch.setattr(update_safety.uuid, \"uuid4\", lambda: FixedUuid())\n    before = digest(paths.database_path)\n\n    with pytest.raises(UpdateSafetyError) as caught:\n        initialize_startup(\"user\")\n\n    assert caught.value.category == \"stage-identity-already-exists\"\n    assert digest(paths.database_path) == before\n    assert lineage(paths.database_path) == expected_migration_ids()[:-1]\n    assert stage.read_bytes() == stage_bytes\n    for sidecar, payload in sidecar_bytes.items():\n        assert sidecar.read_bytes() == payload\n    backups = list(paths.backups_dir.iterdir())\n    assert len(backups) == 1\n    assert lineage(backups[0]) == expected_migration_ids()[:-1]\n    record = load_update_journal(update_journal_path(paths))[-1]\n    assert record.status == \"failed\"\n    assert record.failure_category == \"stage-identity-already-exists\"\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('preexisting stage test anchor did not match exactly once')
          text = text.replace(anchor, addition + anchor)
          tests.write_text(text, encoding='utf-8')

          checker = Path('scripts/check_documentation_lifecycle.py')
          text = checker.read_text(encoding='utf-8')
          old = '''        \"cannot prove the immediately previous package version\",\n    ))\n'''
          new = '''        \"cannot prove the immediately previous package version\",\n        \"stage_owned = False\",\n        \"stage_owned = True\",\n    ))\n'''
          if text.count(old) != 1:
              raise SystemExit('checker ownership service anchor did not match exactly once')
          text = text.replace(old, new)
          old = '''            \"test_previous_completed_update_is_not_misreported_as_immediate_from_app_version\",\n            \"test_canonical_sidecar_refuses_before_backup_or_stage\",\n'''
          new = '''            \"test_previous_completed_update_is_not_misreported_as_immediate_from_app_version\",\n            \"test_preexisting_stage_collision_is_preserved\",\n            \"test_canonical_sidecar_refuses_before_backup_or_stage\",\n'''
          if text.count(old) != 1:
              raise SystemExit('checker ownership test anchor did not match exactly once')
          checker.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 -m py_compile backend/app/services/update_safety.py backend/app/tests/test_d4_b_update_safety.py scripts/check_documentation_lifecycle.py
          git diff --check
      - name: Install backend test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check './backend[test]'
      - name: Focused tests and lifecycle checker
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m pytest backend/app/tests/test_d4_b_update_safety.py -q
          python scripts/check_documentation_lifecycle.py
      - name: Negative ownership-state probe
        shell: bash
        run: |
          set -euo pipefail
          cp backend/app/services/update_safety.py "$RUNNER_TEMP/update_safety.py"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/app/services/update_safety.py')
          text = path.read_text(encoding='utf-8')
          old = '    stage_owned = False\n'
          if text.count(old) != 1:
              raise SystemExit('probe target did not match exactly once')
          path.write_text(text.replace(old, '    stage_is_owned = False\n'), encoding='utf-8')
          PY
          if python scripts/check_documentation_lifecycle.py >"$RUNNER_TEMP/ownership-probe.log" 2>&1; then
            echo 'checker failed to catch ownership-state regression' >&2
            cat "$RUNNER_TEMP/ownership-probe.log" >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/update_safety.py" backend/app/services/update_safety.py
          git diff --check
      - name: Commit and fast-forward PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'D4-B stage ownership fix'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/app/services/update_safety.py backend/app/tests/test_d4_b_update_safety.py scripts/check_documentation_lifecycle.py
          git diff --cached --check
          git commit -m 'D4-B preserve unowned stage collisions'
          git push origin HEAD:"$TARGET_BRANCH"
