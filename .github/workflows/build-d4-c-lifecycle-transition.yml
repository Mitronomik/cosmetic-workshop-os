name: Build D4-C lifecycle transition

on:
  push:
    branches:
      - maintenance/d4-c-lifecycle-transition-builder

permissions:
  contents: write

env:
  EXPECTED_HEAD: adfe37a3f68a545635f173c22d4710eacde86e74
  TARGET_BRANCH: agent/d4-c-user-update-status-failure-ux
  BUILDER_BRANCH: maintenance/d4-c-lifecycle-transition-builder

jobs:
  transition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact D4-C implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Exact implementation-head gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git diff --check
          git fetch origin "$BUILDER_BRANCH"

      - name: Apply active docs and state transition
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            d4c_status_transition.py \
            d4c_readme_transition.py \
            d4c_current_lifecycle_text.py \
            d4c_current_lifecycle_section.py \
            d4c_plan_transition.py \
            d4c_supporting_docs_transition.py \
            d4c_state_transition.py; do
            git show "origin/$BUILDER_BRANCH:verification/$script" > "$RUNNER_TEMP/$script"
            python3 "$RUNNER_TEMP/$script"
          done

      - name: Apply checker transition
        shell: bash
        run: |
          set -euo pipefail
          for script in d4c_checker_status.py d4c_checker_implementation.py d4c_checker_carry_forward.py; do
            git show "origin/$BUILDER_BRANCH:verification/$script" > "$RUNNER_TEMP/$script"
            python3 "$RUNNER_TEMP/$script"
          done

      - name: Validate lifecycle checker
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/check_documentation_lifecycle.py
          python3 scripts/check_documentation_lifecycle.py
          git diff --check

      - name: Negative lifecycle and implementation probes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          def must_fail():
              result = subprocess.run(['python3','scripts/check_documentation_lifecycle.py'], stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT)
              if result.returncode == 0:
                  raise SystemExit('negative D4-C lifecycle probe was not caught')

          focus = Path('state/current-focus.md')
          good = focus.read_text(encoding='utf-8')
          probes = [
              ('D4-C — User-facing update status and packaged failure UX — IMPLEMENTED — EXACT-HEAD VERIFICATION AND LIFECYCLE CLOSURE PENDING', 'D4-C — User-facing update status and packaged failure UX — DONE'),
              ('D4-D — Exact-package update verification and D4 lifecycle closure — PLANNED — NOT AUTHORIZED UNTIL D4-C IS MERGED AND VERIFIED', 'D4-D — Exact-package update verification and D4 lifecycle closure — AUTHORIZED NEXT'),
              ('D5 — Remote install checklist — NOT AUTHORIZED BY CR-013', 'D5 — Remote install checklist — AUTHORIZED'),
              ('Product release readiness — NOT CLAIMED', 'Product release readiness — READY'),
              ('Restore — IMPLEMENTED — C4-III VERIFIED AND LIFECYCLE-CLOSED', 'Restore — IN PROGRESS'),
          ]
          for old, new in probes:
              if old not in good: raise SystemExit(f'probe source missing: {old}')
              focus.write_text(good.replace(old,new,1),encoding='utf-8')
              must_fail()
              focus.write_text(good,encoding='utf-8')

          frontend = Path('frontend/src/settings-update-status.ts')
          original = frontend.read_text(encoding='utf-8')
          frontend.write_text(original.replace("fetch('/api/settings/status')", "fetch('/api/settings/status-broken')", 1), encoding='utf-8')
          must_fail()
          frontend.write_text(original,encoding='utf-8')

          protected = Path('launcher/runtime.py')
          original_bytes = protected.read_bytes()
          protected.write_bytes(original_bytes + b'\n# mutation probe\n')
          must_fail()
          protected.write_bytes(original_bytes)
          PY
          python3 scripts/check_documentation_lifecycle.py

      - name: Exact lifecycle-only scope gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$EXPECTED_HEAD"...HEAD >/tmp/committed-before.txt
          test ! -s /tmp/committed-before.txt
          git diff --name-only | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          README.md
          docs/current-lifecycle.md
          docs/deployment.md
          docs/implementation-plan.md
          docs/packaging.md
          docs/update-guide.md
          scripts/check_documentation_lifecycle.py
          state/change-requests.md
          state/current-focus.md
          state/handoff.md
          state/progress.md
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test -z "$(git diff -- launcher/runtime.py frontend/src/main.ts)"

      - name: Commit verified lifecycle transition
        shell: bash
        run: |
          set -euo pipefail
          git add README.md docs/current-lifecycle.md docs/deployment.md docs/implementation-plan.md docs/packaging.md docs/update-guide.md scripts/check_documentation_lifecycle.py state/change-requests.md state/current-focus.md state/handoff.md state/progress.md
          git diff --cached --check
          git config user.name 'D4-C lifecycle transition'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'D4-C mark implementation pending verification'
          git push origin HEAD:"$TARGET_BRANCH"
