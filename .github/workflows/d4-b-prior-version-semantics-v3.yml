name: D4-B prior-version semantics repair runner v3

on:
  push:
    branches:
      - maintenance/d4-b-prior-version-semantics-runner

permissions:
  contents: write

env:
  EXPECTED_HEAD: c50f31287b4a5126f387f072afcd0ea9d819ba63
  TARGET_BRANCH: agent/d4-b-staged-update-safety
  PATCH_BRANCH: maintenance/d4-b-prior-version-semantics-runner

jobs:
  repair:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Exact-head preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git diff --check
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply reviewable patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$PATCH_BRANCH"
          git show "origin/$PATCH_BRANCH:maintenance/d4-b-prior-version-semantics.patch" > "$RUNNER_TEMP/d4-b-prior-version-semantics.patch"
          git apply --check "$RUNNER_TEMP/d4-b-prior-version-semantics.patch"
          git apply "$RUNNER_TEMP/d4-b-prior-version-semantics.patch"
          python3 -m py_compile backend/app/services/update_safety.py backend/app/tests/test_d4_b_update_safety.py scripts/check_documentation_lifecycle.py
          git diff --check
      - name: Install backend test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check './backend[test]'
      - name: Focused tests and lifecycle checker
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m pytest backend/app/tests/test_d4_b_update_safety.py -q
          python scripts/check_documentation_lifecycle.py
      - name: Negative prior-version inference probe
        shell: bash
        run: |
          set -euo pipefail
          cp backend/app/services/update_safety.py "$RUNNER_TEMP/update_safety.py"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/app/services/update_safety.py')
          text = path.read_text(encoding='utf-8')
          old = '        from_app_version=None,\n'
          new = '        from_app_version=records[-1].to_app_version if records else None,\n'
          if text.count(old) != 1:
              raise SystemExit('probe target did not match exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          if python scripts/check_documentation_lifecycle.py >"$RUNNER_TEMP/prior-version-probe.log" 2>&1; then
            echo 'checker failed to catch prior-version inference regression' >&2
            cat "$RUNNER_TEMP/prior-version-probe.log" >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/update_safety.py" backend/app/services/update_safety.py
          git diff --check
      - name: Commit and fast-forward PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'D4-B prior-version semantics'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/app/services/update_safety.py backend/app/tests/test_d4_b_update_safety.py docs/domain-model-d4-update-safety.md docs/current-lifecycle.md scripts/check_documentation_lifecycle.py
          git diff --cached --check
          git commit -m 'D4-B keep unproven prior package version unknown'
          git push origin HEAD:"$TARGET_BRANCH"
