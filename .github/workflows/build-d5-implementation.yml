name: Build D5 implementation

on:
  push:
    branches:
      - verification/d5-implementation-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TARGET: docs/d5-remote-install-rehearsal
      BUILDER: verification/d5-implementation-builder
      EXPECTED_BASE: c91e62930915da357a2f9c74b9a054fe98e9df14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/d5-remote-install-rehearsal
          fetch-depth: 0
      - name: Build validate and publish D5 implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET" "$BUILDER"
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          test "$(git rev-parse origin/$TARGET)" = "$EXPECTED_BASE"
          test -z "$(git status --porcelain)"

          git show "origin/$BUILDER:verification/build_d5_impl.py" > "$RUNNER_TEMP/build_d5_impl.py"
          python3 "$RUNNER_TEMP/build_d5_impl.py"

          python3 -m py_compile scripts/check_documentation_lifecycle.py
          python3 scripts/check_documentation_lifecycle.py
          git diff --check

          mapfile -t changed < <(git diff --name-only | sort)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          expected=(
            README.md
            docs/backup-and-restore.md
            docs/current-lifecycle.md
            docs/deployment.md
            docs/implementation-plan.md
            docs/packaging.md
            docs/remote-install-checklist.md
            docs/update-guide.md
            docs/user-install.md
            scripts/check_documentation_lifecycle.py
            state/change-requests.md
            state/current-focus.md
            state/handoff.md
            state/progress.md
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
          ! printf '%s\n' "${changed[@]}" | grep -E '^(backend/|frontend/|launcher/|macos_package/|migrations/)'

          git add "${expected[@]}"
          git diff --cached --check
          test -z "$(git status --porcelain | grep '^??' || true)"
          git config user.name 'D5 implementation builder'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'D5 implement remote install guide and rehearsal checklist'
          git push origin HEAD:"$TARGET"
