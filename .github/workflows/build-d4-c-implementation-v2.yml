name: Build D4-C implementation v2

on:
  push:
    branches:
      - maintenance/d4-c-implementation-builder-v2

permissions:
  contents: write

env:
  EXPECTED_BASE: 20d7190ebd91012a58993bf02934d6f4459332a0
  IMPLEMENTATION_BRANCH: agent/d4-c-user-update-status-failure-ux
  TRANSFORM_SOURCE_BRANCH: maintenance/d4-c-implementation-builder

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.IMPLEMENTATION_BRANCH }}
          fetch-depth: 0

      - name: Exact base gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          test -z "$(git status --porcelain)"
          git diff --check

      - name: Reuse deterministic D4-C transform
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TRANSFORM_SOURCE_BRANCH"
          python3 - <<'PY'
          import re
          import subprocess
          from textwrap import dedent

          yaml = subprocess.check_output(
              ['git', 'show', 'origin/maintenance/d4-c-implementation-builder:.github/workflows/build-d4-c-implementation.yml'],
              text=True,
          )
          marker = '      - name: Apply bounded D4-C implementation\n'
          start = yaml.index(marker)
          tail = yaml[start:]
          match = re.search(r"python3 - <<'PY'\n(?P<body>.*?)^\s+PY\s*$", tail, re.MULTILINE | re.DOTALL)
          if not match:
              raise SystemExit('cannot locate D4-C transform')
          script = dedent(match.group('body'))
          exec(compile(script, '<d4-c-transform>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install backend test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check './backend[test]'

      - name: Backend launcher and package focused tests
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m py_compile backend/app/services/update_safety.py backend/app/services/settings.py backend/app/schemas/settings.py launcher/runtime.py macos_package/entrypoint.py macos_package/user_alert.py
          python -m pytest -q \
            backend/app/tests/test_d4_c_update_status.py \
            backend/app/tests/test_settings.py \
            backend/app/tests/test_settings_api.py \
            launcher/tests/test_d4_c_update_failure_mapping.py \
            macos_package/tests/test_d4_c_update_failure_alerts.py \
            macos_package/tests/test_macos_package_entrypoint.py

      - name: Frontend focused test and build
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run test:settings-update-status
          npm run build

      - name: Lifecycle and implementation scope gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_documentation_lifecycle.py
          git diff --check
          git diff --name-only > /tmp/d4c-files.txt
          test "$(wc -l < /tmp/d4c-files.txt | tr -d ' ')" = "14"
          if grep -Ev '^(backend/app/(schemas/settings\.py|services/(settings|update_safety)\.py|tests/test_d4_c_update_status\.py)|launcher/(runtime\.py|tests/test_d4_c_update_failure_mapping\.py)|macos_package/(entrypoint\.py|user_alert\.py|tests/test_d4_c_update_failure_alerts\.py)|frontend/(package\.json|src/(main|settings-update-status)\.ts|test/settings-update-status\.test\.mjs|tsconfig\.test\.settings-update-status\.json))$' /tmp/d4c-files.txt; then
            echo 'D4-C implementation scope leak' >&2
            exit 1
          fi
          ! grep -Eq '^(migrations/|docs/|state/|scripts/package_macos\.sh|requirements|backend/VERSION)' /tmp/d4c-files.txt

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git add \
            backend/app/schemas/settings.py \
            backend/app/services/settings.py \
            backend/app/services/update_safety.py \
            backend/app/tests/test_d4_c_update_status.py \
            launcher/runtime.py \
            launcher/tests/test_d4_c_update_failure_mapping.py \
            macos_package/entrypoint.py \
            macos_package/user_alert.py \
            macos_package/tests/test_d4_c_update_failure_alerts.py \
            frontend/package.json \
            frontend/src/main.ts \
            frontend/src/settings-update-status.ts \
            frontend/test/settings-update-status.test.mjs \
            frontend/tsconfig.test.settings-update-status.json
          git diff --cached --check
          git config user.name 'D4-C implementation builder'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'D4-C add user-facing update status and packaged failure UX'
          git push origin HEAD:"$IMPLEMENTATION_BRANCH"
