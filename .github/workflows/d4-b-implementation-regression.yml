name: D4-B implementation regression verifier

on:
  push:
    branches:
      - verification/d4-b-impl-ad722854

permissions:
  contents: read

env:
  EXPECTED_HEAD: ad7228545ee8f838fb114ba072524fc5174acaba

jobs:
  regression:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Checkout exact D4-B implementation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 1
      - name: Exact-head preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git diff --check
          test ! -e backend/app/services/startup_d4b_tmp.py
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check './backend[test]'
      - name: Full Python regression
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: python -m pytest backend/app/tests launcher/tests macos_package/tests -q
      - name: Clean postflight
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backend/build
          find backend -maxdepth 1 -type d -name '*.egg-info' -prune -exec rm -rf {} + 2>/dev/null || true
          git restore --source="$EXPECTED_HEAD" --worktree -- backend 2>/dev/null || true
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --check
          test -z "$(git status --porcelain)"
