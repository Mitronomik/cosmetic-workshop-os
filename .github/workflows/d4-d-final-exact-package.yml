name: D4-D final exact-package verification
on:
  push:
    branches: [verification/d4-d-final-ec88b091]
permissions:
  contents: read
env:
  EXPECTED_HEAD: ec88b09193c8ed041e17daef3e3ffc0193d1b559
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 70
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run external D4-D verifier
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin verification/d4-d-final-ec88b091
          git show origin/verification/d4-d-final-ec88b091:verification/d4d_final_verify.py > "$RUNNER_TEMP/d4d_final_verify.py"
          python3 -m py_compile "$RUNNER_TEMP/d4d_final_verify.py"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 "$RUNNER_TEMP/d4d_final_verify.py"
      - name: Upload D4-D evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d4-d-final-ec88b091-evidence
          path: ${{ runner.temp }}/d4-d-final-evidence
          if-no-files-found: error
