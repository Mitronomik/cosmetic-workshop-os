name: D4-C merged-head verifier 3d69df19

on:
  push:
    branches:
      - verification/d4-c-merged-3d69df19

permissions:
  contents: read

env:
  EXPECTED_BASE: 3d69df192b5bdff9c7df067d8c8fde40154ebac9
  EXPECTED_HEAD: 3d69df192b5bdff9c7df067d8c8fde40154ebac9
  PR_BRANCH: main
  VERIFIER_BRANCH: verification/pr200-ba577f11

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 55
    steps:
      - name: Checkout exact merged head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Run external D4-C Level-5 verifier
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$VERIFIER_BRANCH"
          git show "origin/$VERIFIER_BRANCH:verification/pr200_level5.py" > "$RUNNER_TEMP/d4c_merged_level5.py"
          python3 -m py_compile "$RUNNER_TEMP/d4c_merged_level5.py"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 "$RUNNER_TEMP/d4c_merged_level5.py"

      - name: Upload merged-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d4-c-merged-3d69df19-evidence
          path: ${{ runner.temp }}/pr200-ba577f11-evidence
          if-no-files-found: error
