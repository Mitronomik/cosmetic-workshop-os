name: PR204 CR-014 D5 decision verifier

on:
  push:
    branches: [verification/pr204-6e83cf42]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      EXPECTED_BASE: a8a28672a6fd807cd59342a02a102b8e09128fff
      EXPECTED_HEAD: 6e83cf420b53fe129ceadfeb308269db275c8d2c
      PR_BRANCH: docs/cr-014-d5-remote-install-contract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6e83cf420b53fe129ceadfeb308269db275c8d2c
          fetch-depth: 0

      - name: Run external CR-014 verifier
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin verification/pr204-6e83cf42
          git show origin/verification/pr204-6e83cf42:verification/pr204_d5_decision_verify.py > "$RUNNER_TEMP/pr204.py"
          python3 -m py_compile "$RUNNER_TEMP/pr204.py"
          EVIDENCE_DIR="$RUNNER_TEMP/pr204-d5-decision-evidence" python3 "$RUNNER_TEMP/pr204.py"

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr204-d5-decision-6e83cf42-evidence
          path: ${{ runner.temp }}/pr204-d5-decision-evidence
          if-no-files-found: error
