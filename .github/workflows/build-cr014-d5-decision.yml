name: Build CR-014 D5 decision

on:
  push:
    branches: [verification/cr014-d5-decision-builder]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: docs/cr-014-d5-remote-install-contract
      BUILDER: verification/cr014-d5-decision-builder
      EXPECTED_BASE: a8a28672a6fd807cd59342a02a102b8e09128fff
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/cr-014-d5-remote-install-contract
          fetch-depth: 0

      - name: Build validate and publish CR-014
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET" "$BUILDER"
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          test "$(git rev-parse origin/$TARGET)" = "$EXPECTED_BASE"
          test -z "$(git status --porcelain)"

          for script in \
            cr014_snapshot.py \
            cr014_docs.py \
            cr014_decisions_agents.py \
            cr014_checker.py \
            cr014_checker_post.py; do
            git show "origin/$BUILDER:verification/$script" > "$RUNNER_TEMP/$script"
          done
          git show "origin/$BUILDER:verification/cr014_adr21.md" > "$RUNNER_TEMP/cr014_adr21.md"
          git show "origin/$BUILDER:verification/cr014_validate.py" > "$RUNNER_TEMP/cr014_validate.py"
          git show "origin/$BUILDER:verification/cr014_scope.py" > "$RUNNER_TEMP/cr014_scope.py"

          python3 "$RUNNER_TEMP/cr014_snapshot.py"
          cp "$RUNNER_TEMP/cr014_adr21.md" docs/decisions/0021-d5-remote-install-rehearsal-contract.md
          python3 "$RUNNER_TEMP/cr014_docs.py"
          python3 "$RUNNER_TEMP/cr014_decisions_agents.py"
          python3 "$RUNNER_TEMP/cr014_checker.py"
          python3 "$RUNNER_TEMP/cr014_checker_post.py"

          python3 -m py_compile scripts/check_documentation_lifecycle.py
          python3 scripts/check_documentation_lifecycle.py
          git diff --check
          python3 "$RUNNER_TEMP/cr014_validate.py"
          python3 "$RUNNER_TEMP/cr014_scope.py"

          git add \
            README.md \
            docs/AGENTS.md \
            docs/decisions/AGENTS.md \
            docs/decisions/0021-d5-remote-install-rehearsal-contract.md \
            docs/current-lifecycle.md \
            docs/deployment.md \
            docs/history/README.md \
            docs/history/d5-pre-decision \
            docs/implementation-plan.md \
            docs/packaging.md \
            docs/remote-install-checklist.md \
            docs/update-guide.md \
            docs/user-install.md \
            scripts/check_documentation_lifecycle.py \
            state/change-requests.md \
            state/current-focus.md \
            state/handoff.md \
            state/progress.md
          git diff --cached --check
          test -z "$(git status --porcelain | grep '^??' || true)"

          git config user.name 'CR-014 decision builder'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'CR-014 decide D5 remote install rehearsal contract'
          git push origin HEAD:"$TARGET"
