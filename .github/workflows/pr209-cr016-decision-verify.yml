name: PR209 CR-016 decision exact-head verification

on:
  push:
    branches:
      - verification/pr209-1319b4fc

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_BASE: 93bdb1d51f6fe3e998051a7dda440c45ad17f30a
      EXPECTED_HEAD: 1319b4fcf7ac6e58e067542aa049b968ecf5c511
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1319b4fcf7ac6e58e067542aa049b968ecf5c511
          fetch-depth: 0
      - name: Verify exact decision changeset
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --check "$EXPECTED_BASE...$EXPECTED_HEAD"
          python3 -m py_compile scripts/check_documentation_lifecycle.py
          python3 scripts/check_documentation_lifecycle.py
          git diff --name-only "$EXPECTED_BASE...$EXPECTED_HEAD" | sort > "$RUNNER_TEMP/changed.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          docs/decisions/0023-single-client-assisted-install-bootstrap.md
          state/change-requests.md
          state/current-focus.md
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/expected.txt"
          sort -o "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/changed.txt"
          ! grep -E '^(backend/|frontend/|launcher/|macos_package/|migrations/|scripts/macos/|scripts/package_macos\.sh$)' "$RUNNER_TEMP/changed.txt"
          grep -q 'Mandatory verification-before-quarantine-removal contract' docs/decisions/0023-single-client-assisted-install-bootstrap.md
          grep -q 'spctl --master-disable' docs/decisions/0023-single-client-assisted-install-bootstrap.md
          grep -q 'CR-016 — Single-client assisted install and update bootstrap' state/change-requests.md
          grep -q 'Implement only CR-016' state/current-focus.md
          echo 'PASS — CR-016 DECISION EXACT-HEAD VERIFIED'
