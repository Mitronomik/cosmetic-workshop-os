name: Build D4-B lifecycle closure v2

on:
  push:
    branches: [maintenance/d4-b-lifecycle-closure-builder-v2]

permissions:
  contents: write

env:
  BASE: d60a3be993c76b59292cf27ee66bcbe856669fc4
  PR_HEAD: 8688fa3dba87205b4b4626ebab2902262fd4cd24
  PR_RUN: '31716610699'
  PR_ARTIFACT: '9187785415'
  PR_DIGEST: sha256:fbbaa56a173929f41e18aa49adad40854210806433de2309052cffda8a4c7012
  MERGED_RUN: '31717705331'
  MERGED_ARTIFACT: '9188228739'
  MERGED_DIGEST: sha256:2a3e615e504e6c047b8f1b45690f3595a0ef4bb71dcd1d9fadf669ecd64af415
  TARGET: agent/d4-b-lifecycle-closure

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET }}
          fetch-depth: 0
      - name: Exact base gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git status --porcelain)"
          git diff --check
          test -z "$(git diff --name-only "$PR_HEAD"..."$BASE")"
      - name: Build closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json, os, re, subprocess
          from hashlib import sha1
          from pathlib import Path

          R=Path('.')
          B=os.environ['BASE']; H=os.environ['PR_HEAD']
          PR=os.environ['PR_RUN']; PA=os.environ['PR_ARTIFACT']; PD=os.environ['PR_DIGEST']
          MR=os.environ['MERGED_RUN']; MA=os.environ['MERGED_ARTIFACT']; MD=os.environ['MERGED_DIGEST']
          old_d4='D4 — Update safety — IN PROGRESS — D4-B IMPLEMENTED, VERIFICATION PENDING'
          new_d4='D4 — Update safety — IN PROGRESS — D4-A DONE; D4-B DONE; D4-C AUTHORIZED NEXT'
          old_b='D4-B — Safe migration execution and durable UpdateLog — IMPLEMENTED — EXACT-HEAD VERIFICATION AND LIFECYCLE CLOSURE PENDING'
          new_b='D4-B — Safe migration execution and durable UpdateLog — DONE — MERGED AND EXACT-HEAD VERIFIED'
          old_c='D4-C — User-facing update status and packaged failure UX — PLANNED — NOT AUTHORIZED UNTIL D4-B IS MERGED AND VERIFIED'
          new_c='D4-C — User-facing update status and packaged failure UX — AUTHORIZED NEXT — NOT IMPLEMENTED'

          src={
            'README.md':'README.md','current-lifecycle.md':'docs/current-lifecycle.md','implementation-plan.md':'docs/implementation-plan.md',
            'packaging.md':'docs/packaging.md','deployment.md':'docs/deployment.md','update-guide.md':'docs/update-guide.md',
            'current-focus.md':'state/current-focus.md','progress.md':'state/progress.md','handoff.md':'state/handoff.md',
            'change-requests.md':'state/change-requests.md','check_documentation_lifecycle.py':'scripts/check_documentation_lifecycle.py',
            'history-README.md':'docs/history/README.md'}
          sd=R/'docs/history/d4-b-pre-closure'; sd.mkdir(parents=True)
          files={}
          for name,path in src.items():
            data=subprocess.check_output(['git','show',f'{B}:{path}']); (sd/name).write_bytes(data)
            files[name]=subprocess.check_output(['git','rev-parse',f'{B}:{path}'],text=True).strip()
          manifest={'source_commit':B,'verified_pr_head':H,'pr_head_verification_run':PR,'merged_head_verification_run':MR,'files':files}
          mb=(json.dumps(manifest,indent=2,sort_keys=True)+'\n').encode(); (sd/'manifest.json').write_bytes(mb)
          msha=sha1(f'blob {len(mb)}\0'.encode()+mb).hexdigest()
          (sd/'ABOUT.md').write_text(
            f'# D4-B pre-closure snapshot\n\nSource merged head: `{B}`.\n\nExact implementation head verified before merge: `{H}`.\n\n'
            f'Exact PR-head verification run: `{PR}`; evidence artifact `{PA}`; digest `{PD}`.\n\n'
            f'Exact merged-head verification run: `{MR}`; evidence artifact `{MA}`; digest `{MD}`.\n\n'
            'Git compare from the verified implementation head to the merge commit contains `0` changed files.\n\n'
            'Every listed snapshot file preserves the exact Git blob identity from the source merged head. These files are historical evidence only; current authority remains `docs/current-lifecycle.md`.\n',encoding='utf-8')

          surfaces=['README.md','docs/current-lifecycle.md','docs/implementation-plan.md','docs/packaging.md','docs/deployment.md','state/current-focus.md','state/progress.md','state/handoff.md','state/change-requests.md']
          for f in surfaces:
            p=R/f; t=p.read_text(encoding='utf-8')
            for a,b in ((old_d4,new_d4),(old_b,new_b),(old_c,new_c)):
              if a not in t: raise SystemExit(f'{f}: missing lifecycle line {a}')
              t=t.replace(a,b)
            p.write_text(t,encoding='utf-8')

          def rep(f,a,b):
            p=R/f; t=p.read_text(encoding='utf-8')
            if t.count(a)!=1: raise SystemExit(f'{f}: replacement mismatch: {a}')
            p.write_text(t.replace(a,b,1),encoding='utf-8')

          rep('README.md','D4-B is implemented in the current changeset but is not lifecycle-closed. Exact-head verification is required before D4-C may become authorized. D4-C/D remain gated.','D4-B is merged, exact-head/exact-package verified and lifecycle-closed by this closure. D4-C is now the only authorized next slice; D4-D remains gated.')
          rep('README.md','## D4-B implementation pending verification','## D4-B closed baseline / D4-C next')
          rep('README.md','- D4-C UI/failure UX remains out of scope and unauthorized.','- D4-C UI/failure UX was not implemented by D4-B; this closure authorizes it as the next separate slice.\n\nD4-B closure evidence: verified PR head `'+H+'`, PR-head Level-5 run `'+PR+'`; merged head `'+B+'`, merged-head Level-5 run `'+MR+'`. Both exact-package runs passed and the verified PR head is content-identical to the merge commit.')

          rep('docs/current-lifecycle.md','- supported older lineage still uses the existing direct backup + migration execution after the gate. Replacing that execution with staged migration is D4-B and is not implemented here.','- D4-A itself originally stopped at the compatibility gate; the now-closed D4-B slice replaces the supported-older direct migration seam with staged migration after that gate.')
          rep('docs/current-lifecycle.md','D4-A is merged and exact-head verified. D4-B is implemented in the current changeset, but exact-head verification and lifecycle closure are still pending; D4-C remains unauthorized.','D4-A remains merged and exact-head verified. D4-B is now merged, exact-head/exact-package verified and lifecycle-closed; D4-C alone is authorized next.')
          rep('docs/current-lifecycle.md','## D4-B implementation truth','## D4-B closure truth')
          rep('docs/current-lifecycle.md','D4-B is **implementation-complete only in this changeset**. It is not lifecycle-closed, D4-C is not authorized, and exact-head + exact-package verification remain mandatory before any next-slice authorization.','D4-B is **DONE — MERGED AND VERIFIED**. Exact PR-head Level-5 run `'+PR+'` and exact merged-head Level-5 run `'+MR+'` both passed; implementation head `'+H+'` and merge commit `'+B+'` are content-identical. D4-C is the only authorized next slice.')
          p=R/'docs/current-lifecycle.md'; t=p.read_text(encoding='utf-8'); anchor='## Closed Restore boundary\n'
          add=(f'## D4-B closure evidence\n\n- verified implementation head: `{H}`;\n- PR-head Level-5 verifier: run `{PR}`, artifact `{PA}`, digest `{PD}`;\n- merge/current main: `{B}`; verified-head → merge compare: `0` changed files;\n- merged-head Level-5 verifier: run `{MR}`, artifact `{MA}`, digest `{MD}`;\n- both runs ended `PASS — FULL AUTOMATED SMOKE PASSED`.\n\n## D4-C authorization boundary\n\nThis closure authorizes **D4-C only**: bounded user-facing update status and packaged failure UX. It does not authorize D4-D, D5, auto-download/update checking, signing, notarization, DMG, App Store, release channels, release readiness or Restore changes.\n\n')
          if t.count(anchor)!=1: raise SystemExit('current lifecycle anchor mismatch')
          p.write_text(t.replace(anchor,add+anchor,1),encoding='utf-8')

          rep('docs/implementation-plan.md','- supported older schemas still enter the existing `before_migration` backup and direct migration path after preflight;\n- no UpdateLog exists yet;','- D4-A originally left supported-older migration execution unchanged; the closed D4-B slice now owns staged execution after preflight;\n- D4-A itself introduced no UpdateLog; D4-B now owns the durable external UpdateLog;')
          rep('docs/implementation-plan.md','D4-A is merged, exact-head verified and lifecycle-closed. D4-B is now the only authorized next slice and remains not implemented.','D4-A remains merged, exact-head verified and lifecycle-closed. D4-B is also merged, verified and closed; D4-C is now the only authorized next slice.')
          rep('docs/implementation-plan.md','**IMPLEMENTED — EXACT-HEAD VERIFICATION AND LIFECYCLE CLOSURE PENDING**.','**DONE — MERGED AND EXACT-HEAD/EXACT-PACKAGE VERIFIED**.')
          rep('docs/implementation-plan.md','D4-B cannot authorize D4-C until this implementation is merged, exact-head verified and lifecycle-closed.','D4-B closure conditions are satisfied on merged head `'+B+'`. D4-C is authorized next as a separate bounded PR.')
          rep('docs/implementation-plan.md','**PLANNED — NOT AUTHORIZED UNTIL D4-B IS MERGED AND VERIFIED**.','**AUTHORIZED NEXT — NOT IMPLEMENTED**.')

          rep('docs/packaging.md','Status: **CURRENT — D3 IMPLEMENTED; D4-A CLOSED; D4-B IMPLEMENTED, VERIFICATION PENDING**','Status: **CURRENT — D3 IMPLEMENTED; D4-A/B CLOSED; D4-C AUTHORIZED NEXT**')
          rep('docs/packaging.md','D4 remains safe manual package replacement. D4-A supplies the closed compatibility gate; D4-B now implements staged migration and durable external UpdateLog on the same ordinary packaged startup path, but exact-package verification and lifecycle closure are still pending.','D4 remains safe manual package replacement. D4-A supplies the closed compatibility gate; closed D4-B supplies staged migration and durable external UpdateLog on the same ordinary packaged startup path. D4-C is now authorized to add only bounded user-facing status/failure presentation.')
          rep('docs/packaging.md','CR-013/D4-A do not authorize auto-update download, internet update checking, GitHub Releases integration, release channels, installer redesign, signing/notarization, DMG, App Store, sandbox migration, D5 or release readiness.','D4-B closure authorizes D4-C only. It does not authorize auto-update download, internet update checking, GitHub Releases integration, release channels, installer redesign, signing/notarization, DMG, App Store, sandbox migration, D5 or release readiness.')
          rep('docs/deployment.md','D4-B now implements the migration stage and durable UpdateLog under the existing external user-data boundary. It adds no service, cloud dependency or second launcher topology; verification and lifecycle closure are still pending.','Closed D4-B implements the migration stage and durable UpdateLog under the existing external user-data boundary. It adds no service, cloud dependency or second launcher topology; exact PR-head and merged-head Level-5 verification passed.')
          rep('docs/deployment.md','D4-B implementation does not authorize D4-C. D4-C/D and D5 remain unauthorized. No signing, notarization, DMG, App Store, release channel, updater downloader, cloud deployment or cloud sync is authorized by CR-013.','D4-B closure authorizes D4-C only. D4-D and D5 remain unauthorized. No signing, notarization, DMG, App Store, release channel, updater downloader, cloud deployment or cloud sync is authorized by CR-013.')
          rep('docs/update-guide.md','Статус: **D4-A закрыт; безопасная миграция D4-B реализована в текущем changeset, но exact-head проверка и lifecycle closure ещё не завершены**.','Статус: **D4-A закрыт; D4-B закрыт и проверен; D4-C авторизован следующим, но пользовательский update UX ещё не реализован**.')
          rep('docs/update-guide.md','Этот файл пока **не является инструкцией о готовом обновлении продукта**. D4-A закрыт; D4-B реализует безопасный staged migration + durable UpdateLog, но ещё не прошёл обязательную exact-head/exact-package проверку и lifecycle closure. D4-C/D также не реализованы и не авторизованы.','Этот файл пока **не является инструкцией о готовом обновлении продукта**. D4-A закрыт; D4-B закрыт; безопасный staged migration + durable UpdateLog прошли exact-head/exact-package проверку. D4-C теперь авторизован следующим, но пользовательский update status/failure UX ещё не реализован; D4-D остаётся неавторизован.')

          focus=R/'state/current-focus.md'; focus.write_text(f'''# Current focus\n\nUpdated: `2026-08-13`\n\n## Current lifecycle\n\n```text\nC4-III — DONE — EXACT-HEAD AND EXACT-PACKAGE VERIFIED\nRestore — IMPLEMENTED — C4-III VERIFIED AND LIFECYCLE-CLOSED\nD3 — macOS package MVP — IMPLEMENTED\nCR-013 — ACCEPTED — D4 UPDATE SAFETY CONTRACT\n{new_d4}\nD4-A — Version identity and compatibility preflight — DONE — MERGED AND EXACT-HEAD VERIFIED\n{new_b}\n{new_c}\nD4-D — Exact-package update verification and D4 lifecycle closure — PLANNED — NOT AUTHORIZED UNTIL D4-C IS MERGED AND VERIFIED\nD5 — Remote install checklist — NOT AUTHORIZED BY CR-013\nProduct release readiness — NOT CLAIMED\n```\n\n## Current task\n\n**Implement D4-C only, in a separate bounded PR.**\n\nD4-A and D4-B are closed. D4-C may add only human-facing update status and bounded packaged failure UX on top of the existing startup-owned truth. It must not create a technical update admin dashboard or move update authority into the browser.\n\n## D4-B closure evidence\n\n- verified PR head: `{H}`; run `{PR}`; artifact `{PA}`;\n- merged head/current main: `{B}`; run `{MR}`; artifact `{MA}`;\n- verified-head → merged-head compare: `0` changed files;\n- both Level-5 reports ended `PASS — FULL AUTOMATED SMOKE PASSED`.\n\n## Do not start\n\n- D4-D exact-package closure;\n- D5;\n- auto-update/download;\n- signing/notarization/DMG/App Store;\n- release readiness;\n- Restore changes.\n\nNormative decision: `docs/decisions/0020-d4-update-safety-contract.md`.\n''',encoding='utf-8')
          rep('state/progress.md','## D4-B implementation pending verification','## D4-B closure')
          rep('state/progress.md','The current D4-B changeset implements staged migration, verified `before_migration` backup, atomic canonical publication, durable external UpdateLog and conservative interruption reconciliation. Full exact-head and exact-package verification are still required before lifecycle closure.\n\nD4-C/D, D5 and release readiness remain gated.','D4-B is merged and verified on `'+B+'`. PR-head Level-5 run `'+PR+'` and merged-head Level-5 run `'+MR+'` both passed; implementation head and merge commit are content-identical. D4-C is authorized next.\n\nD4-D, D5 and release readiness remain gated.')
          rep('state/handoff.md','- D4-B is IMPLEMENTED — exact-head verification and lifecycle closure pending.','- D4-B is DONE — merged, exact-head/exact-package verified and lifecycle-closed.')
          rep('state/handoff.md','## D4-B implementation handoff','## D4-B closed handoff / D4-C next')
          rep('state/handoff.md','If D4-B verification reveals a need to change a protected Restore production blob or authorize D4-C behavior, stop and open the appropriate separate decision/lifecycle step rather than widening this implementation PR.','D4-C may now be implemented only within its bounded user-facing status/failure UX scope. If it requires a protected Restore production change, new update authority, D4-D behavior or release/distribution work, stop rather than widening D4-C.')
          rep('state/handoff.md','Verification evidence: merged head `89dd69dc1958e622146e01869cc34d4cd2ec859e`, run `31699624984`, artifact `9180924875`.','D4-A evidence remains recorded above. D4-B evidence: verified PR head `'+H+'`, run `'+PR+'`, artifact `'+PA+'`; merged head `'+B+'`, run `'+MR+'`, artifact `'+MA+'`; compare `0` changed files.')
          rep('state/change-requests.md','Status: **ACCEPTED — D4-A CLOSED; D4-B IMPLEMENTED, VERIFICATION PENDING**.','Status: **ACCEPTED — D4-A/B CLOSED; D4-C AUTHORIZED NEXT**.')
          rep('state/change-requests.md','D4-A remains closed. The current D4-B changeset implements staged migrations, verified backup, atomic canonical publication, durable external UpdateLog and interruption reconciliation. It does not implement D4-C update UI/failure UX or D4-D lifecycle closure.','D4-A and D4-B are closed. D4-B provides staged migrations, verified backup, atomic canonical publication, durable external UpdateLog and interruption reconciliation. D4-C update status/failure UX is authorized next but remains unimplemented; D4-D remains unauthorized.')
          rep('state/change-requests.md','D4-A closure conditions are satisfied on merged head `89dd69dc1958e622146e01869cc34d4cd2ec859e`. D4-B implementation now requires exact-head verification, merge verification and separate lifecycle closure before D4-C can become authorized.','D4-A closure remains satisfied. D4-B closure conditions are satisfied on verified implementation head `'+H+'` and merged head `'+B+'` with full Level-5 PASS evidence. D4-C alone is authorized next.')

          p=R/'docs/history/README.md'; t=p.read_text(encoding='utf-8'); mark='## Current index\n\n'; entry=f'- `d4-b-pre-closure/` — exact active lifecycle/state/checker surfaces from merged head `{B}` immediately before D4-B closure and D4-C authorization.\n';
          if t.count(mark)!=1: raise SystemExit('history index marker mismatch')
          p.write_text(t.replace(mark,mark+entry,1),encoding='utf-8')

          cp=R/'scripts/check_documentation_lifecycle.py'; c=cp.read_text(encoding='utf-8')
          c=c.replace('D4-A is closed. D4-B may implement staged migration safety and durable external\nUpdateLog, but it may not claim verification/closure, authorize D4-C/D or reopen Restore.','D4-A and D4-B are closed. D4-C alone may implement bounded user-facing update\nstatus/failure UX; it may not authorize D4-D/D5, claim release readiness or reopen Restore.',1)
          a='D4A_PRECLOSURE_ABOUT = P("docs/history/d4-a-pre-closure/ABOUT.md")\n'; c=c.replace(a,a+'D4B_PRECLOSURE_MANIFEST = P("docs/history/d4-b-pre-closure/manifest.json")\nD4B_PRECLOSURE_ABOUT = P("docs/history/d4-b-pre-closure/ABOUT.md")\n',1)
          a='D4A_PRECLOSURE_MANIFEST_SHA = "7debfd4b40c1b32a00fe3417564fd97480f8f043"\n'; c=c.replace(a,a+f'D4B_VERIFIED_PR_HEAD = "{H}"\nD4B_MERGED_HEAD = "{B}"\nD4B_PR_HEAD_RUN = "{PR}"\nD4B_MERGED_RUN = "{MR}"\nD4B_PRECLOSURE_MANIFEST_SHA = "{msha}"\n',1)
          c=re.sub(r'D4_STATUS = \(.*?\n\)\n\nCLOSED_TRUTH',f'''D4_STATUS = (\n    "CR-013 — ACCEPTED — D4 UPDATE SAFETY CONTRACT",\n    "{new_d4}",\n    "D4-A — Version identity and compatibility preflight — DONE — MERGED AND EXACT-HEAD VERIFIED",\n    "{new_b}",\n    "{new_c}",\n    "D4-D — Exact-package update verification and D4 lifecycle closure — PLANNED — NOT AUTHORIZED UNTIL D4-C IS MERGED AND VERIFIED",\n    "D5 — Remote install checklist — NOT AUTHORIZED BY CR-013",\n    "Product release readiness — NOT CLAIMED",\n)\n\nCLOSED_TRUTH''',c,count=1,flags=re.S)
          forb='''FORBIDDEN_ACTIVE = (\n    "D4 — Update safety — IN PROGRESS — D4-B IMPLEMENTED, VERIFICATION PENDING",\n    "D4-B — Safe migration execution and durable UpdateLog — IMPLEMENTED — EXACT-HEAD VERIFICATION AND LIFECYCLE CLOSURE PENDING",\n    "D4-C — User-facing update status and packaged failure UX — PLANNED — NOT AUTHORIZED UNTIL D4-B IS MERGED AND VERIFIED",\n    "D4 — Update safety — DONE",\n    "D4 — Update safety — CLOSED",\n    "D4-C — User-facing update status and packaged failure UX — IMPLEMENTED",\n    "D4-C — User-facing update status and packaged failure UX — DONE",\n    "D4-D — Exact-package update verification and D4 lifecycle closure — AUTHORIZED NEXT",\n    "D4-D — Exact-package update verification and D4 lifecycle closure — IMPLEMENTED",\n    "D5 — Remote install checklist — AUTHORIZED",\n    "D5 — Remote install checklist — IMPLEMENTED",\n    "Product release readiness — READY",\n    "Product release readiness — CLAIMED",\n    "auto-update — AUTHORIZED",\n    "signing — AUTHORIZED",\n    "notarization — AUTHORIZED",\n    "DMG — AUTHORIZED",\n    "App Store — AUTHORIZED",\n    "release channels — AUTHORIZED",\n    "Restore — NOT IMPLEMENTED",\n    "Restore — IN PROGRESS",\n    "Restore — AUTHORIZED NEXT",\n)'''
          c=re.sub(r'FORBIDDEN_ACTIVE = \(.*?\n\)\n\nADR20_SECTIONS',forb+'\n\nADR20_SECTIONS',c,count=1,flags=re.S)
          fn='''def check_d4b_preclosure_snapshot() -> None:\n    verify_blob(D4B_PRECLOSURE_MANIFEST, D4B_PRECLOSURE_MANIFEST_SHA, "D4-B pre-closure manifest")\n    try:\n        payload = json.loads(read(D4B_PRECLOSURE_MANIFEST))\n    except json.JSONDecodeError as exc:\n        ERRORS.append(f"D4-B pre-closure manifest does not parse: {exc}")\n        return\n    if payload.get("source_commit") != D4B_MERGED_HEAD: ERRORS.append("D4-B pre-closure manifest source commit changed")\n    if payload.get("verified_pr_head") != D4B_VERIFIED_PR_HEAD: ERRORS.append("D4-B pre-closure verified PR head changed")\n    if payload.get("pr_head_verification_run") != D4B_PR_HEAD_RUN: ERRORS.append("D4-B pre-closure PR-head verification run changed")\n    if payload.get("merged_head_verification_run") != D4B_MERGED_RUN: ERRORS.append("D4-B pre-closure merged-head verification run changed")\n    files = payload.get("files", {})\n    expected_names = ('README.md','current-lifecycle.md','implementation-plan.md','packaging.md','deployment.md','update-guide.md','current-focus.md','progress.md','handoff.md','change-requests.md','check_documentation_lifecycle.py','history-README.md')\n    if set(files) != set(expected_names): ERRORS.append(f"D4-B pre-closure manifest file set changed: {sorted(files)}")\n    for name in expected_names:\n        expected=files.get(name)\n        if isinstance(expected,str): verify_blob(P(f"docs/history/d4-b-pre-closure/{name}"), expected, "D4-B pre-closure snapshot blob")\n    require(D4B_PRECLOSURE_ABOUT,(D4B_MERGED_HEAD,D4B_VERIFIED_PR_HEAD,D4B_PR_HEAD_RUN,D4B_MERGED_RUN,"`0` changed files","exact Git blob identity"))\n    require(HISTORY_INDEX,("d4-b-pre-closure/",D4B_MERGED_HEAD))\n\n\n'''
          c=c.replace('def check_legacy_protections() -> None:\n',fn+'def check_legacy_protections() -> None:\n',1)
          c=c.replace('require(CURRENT, ("ADR 0020", "D4-A closure truth", "D4-A closure evidence", "D4-B implementation truth", "Restore remains closed"))','require(CURRENT, ("ADR 0020", "D4-A closure truth", "D4-A closure evidence", "D4-B closure truth", "D4-B closure evidence", "D4-C authorization boundary", "Restore remains closed"))',1)
          c=c.replace('require(UPDATE_GUIDE, ("D4-A закрыт", "старый пакет не является автоматическим откатом", "не включает автоматическое скачивание"))','require(UPDATE_GUIDE, ("D4-A закрыт", "D4-B закрыт", "старый пакет не является автоматическим откатом", "не включает автоматическое скачивание"))',1)
          c=c.replace('    check_d4a_preclosure_snapshot()\n    check_current_lifecycle()','    check_d4a_preclosure_snapshot()\n    check_d4b_preclosure_snapshot()\n    check_current_lifecycle()',1)
          c=c.replace('    print("Verified D4-B is implemented but exact-head verification/lifecycle closure remain pending.")\n    print("Verified D4-C/D, D5 and product release readiness remain gated.")','    print("Verified D4-B is lifecycle-closed on exact PR-head and merged-head Level-5 evidence.")\n    print("Verified D4-C alone is authorized next; D4-D, D5 and product release readiness remain gated.")',1)
          cp.write_text(c,encoding='utf-8')
          PY
      - name: Validate and probe
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/check_documentation_lifecycle.py
          python3 scripts/check_documentation_lifecycle.py
          git diff --check
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          p=Path('state/current-focus.md'); good=p.read_text(encoding='utf-8')
          probes=[
            ('D4-C — User-facing update status and packaged failure UX — AUTHORIZED NEXT — NOT IMPLEMENTED','D4-C — User-facing update status and packaged failure UX — IMPLEMENTED'),
            ('D4-D — Exact-package update verification and D4 lifecycle closure — PLANNED — NOT AUTHORIZED UNTIL D4-C IS MERGED AND VERIFIED','D4-D — Exact-package update verification and D4 lifecycle closure — AUTHORIZED NEXT'),
            ('D5 — Remote install checklist — NOT AUTHORIZED BY CR-013','D5 — Remote install checklist — AUTHORIZED'),
            ('Product release readiness — NOT CLAIMED','Product release readiness — READY'),
            ('Restore — IMPLEMENTED — C4-III VERIFIED AND LIFECYCLE-CLOSED','Restore — IN PROGRESS')]
          for a,b in probes:
            p.write_text(good.replace(a,b,1),encoding='utf-8')
            if subprocess.run(['python3','scripts/check_documentation_lifecycle.py'],stdout=subprocess.DEVNULL).returncode==0: raise SystemExit(f'probe not caught: {b}')
            p.write_text(good,encoding='utf-8')
          s=Path('docs/history/d4-b-pre-closure/README.md'); data=s.read_bytes(); s.write_bytes(data+b'\nprobe\n')
          if subprocess.run(['python3','scripts/check_documentation_lifecycle.py'],stdout=subprocess.DEVNULL).returncode==0: raise SystemExit('history probe not caught')
          s.write_bytes(data)
          PY
          python3 scripts/check_documentation_lifecycle.py
      - name: Scope and publish
        shell: bash
        run: |
          set -euo pipefail
          git add README.md docs/current-lifecycle.md docs/implementation-plan.md docs/packaging.md docs/deployment.md docs/update-guide.md docs/history/README.md docs/history/d4-b-pre-closure state/current-focus.md state/progress.md state/handoff.md state/change-requests.md scripts/check_documentation_lifecycle.py
          git diff --cached --check
          git diff --cached --name-only >/tmp/files
          if grep -Ev '^(README\.md|docs/(current-lifecycle|implementation-plan|packaging|deployment|update-guide)\.md|docs/history/README\.md|docs/history/d4-b-pre-closure/.*|state/(current-focus|progress|handoff|change-requests)\.md|scripts/check_documentation_lifecycle\.py)$' /tmp/files; then exit 1; fi
          git config user.name 'D4-B lifecycle closure'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'D4-B close lifecycle and authorize D4-C next'
          git push origin HEAD:"$TARGET"
