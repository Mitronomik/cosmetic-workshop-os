name: PR207 native lifecycle exact-package verification

on:
  push:
    branches:
      - verification/pr207-d7f95141

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 70
    env:
      EXPECTED_HEAD: d7f95141e5f41c7a806c3fafb71e942fe5892dd8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run external exact-package lifecycle verifier
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin verification/pr207-d7f95141
          git show origin/verification/pr207-d7f95141:verification/pr207_native_lifecycle_verify.py > "$RUNNER_TEMP/pr207_native_lifecycle_verify.py"
          python3 -m py_compile "$RUNNER_TEMP/pr207_native_lifecycle_verify.py"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 "$RUNNER_TEMP/pr207_native_lifecycle_verify.py"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr207-native-lifecycle-d7f95141-evidence
          path: ${{ runner.temp }}/pr207-native-lifecycle-evidence
          if-no-files-found: error
      - name: Upload fixed exact package
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr207-native-lifecycle-d7f95141-package
          path: ${{ runner.temp }}/pr207-dist/CosmeticWorkshopOS-mac.zip
          if-no-files-found: error
