name: D4-B merged-head verifier d60a3be9

on:
  push:
    branches:
      - verification/d4-b-merged-d60a3be9

permissions:
  contents: read

env:
  EXPECTED_HEAD: d60a3be993c76b59292cf27ee66bcbe856669fc4
  SMOKE_SOURCE_BRANCH: verification/pr198-final-dfae8216

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - name: Checkout exact merged head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Exact-head preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/d4-b-merged-evidence"
          mkdir -p "$EVIDENCE_DIR"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git diff --check
          git rev-parse HEAD > "$EVIDENCE_DIR/actual-head.txt"
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install backend test dependencies
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check './backend[test]' 2>&1 | tee "$EVIDENCE_DIR/backend-deps.log"
      - name: Full Python regression suite
        id: pytest
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m pytest backend/app/tests launcher/tests macos_package/tests -q 2>&1 | tee "$EVIDENCE_DIR/pytest.log"
      - name: Lifecycle and integrity checker
        id: lifecycle
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_documentation_lifecycle.py 2>&1 | tee "$EVIDENCE_DIR/lifecycle.log"
      - name: Frontend reproducible build
        id: frontend
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          (cd frontend && npm ci && npm run build) 2>&1 | tee "$EVIDENCE_DIR/frontend-build.log"
      - name: Build real macOS package
        id: package
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export COSMETIC_WORKSHOP_BUILD_DIR="$RUNNER_TEMP/pr198-final-build"
          export COSMETIC_WORKSHOP_PACKAGE_OUTPUT_DIR="$RUNNER_TEMP/pr198-final-dist"
          bash scripts/package_macos.sh 2>&1 | tee "$EVIDENCE_DIR/package-build.log"
          test -x "$COSMETIC_WORKSHOP_BUILD_DIR/package/CosmeticWorkshopOS.app/Contents/MacOS/CosmeticWorkshopOS"
          test -f "$COSMETIC_WORKSHOP_PACKAGE_OUTPUT_DIR/CosmeticWorkshopOS-mac.zip"
      - name: Load and self-check external package smoke
        id: smoke_selfcheck
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$SMOKE_SOURCE_BRANCH"
          git show "origin/$SMOKE_SOURCE_BRANCH:verification/pr198_d4b_package_smoke.py" > "$RUNNER_TEMP/pr198_d4b_package_smoke.py"
          python3 -m py_compile "$RUNNER_TEMP/pr198_d4b_package_smoke.py"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Exact-package D4-B Level-5 smoke
        id: smoke
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/pr198_d4b_package_smoke.py" 2>&1 | tee "$EVIDENCE_DIR/package-smoke.log"
      - name: Repository postflight
        id: postflight
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frontend/node_modules frontend/dist frontend/dist-tests backend/build
          find backend -maxdepth 1 -type d -name '*.egg-info' -prune -exec rm -rf {} + 2>/dev/null || true
          git restore --source="$EXPECTED_HEAD" --worktree -- frontend backend 2>/dev/null || true
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --check
          STATUS="$(git status --porcelain)"
          printf '%s\n' "$STATUS" > "$EVIDENCE_DIR/final-git-status.txt"
          test -z "$STATUS"
      - name: Final classification and report
        id: classify
        if: always()
        shell: bash
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          SMOKE_SELFCHECK_OUTCOME: ${{ steps.smoke_selfcheck.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          POSTFLIGHT_OUTCOME: ${{ steps.postflight.outcome }}
        run: |
          set -euo pipefail
          STATUS=passed
          if [ "$PREFLIGHT_OUTCOME" != success ] || [ "$DEPS_OUTCOME" != success ] || [ "$POSTFLIGHT_OUTCOME" != success ]; then
            STATUS=environment_inconclusive
          elif [ "$SMOKE_SELFCHECK_OUTCOME" != success ]; then
            STATUS=runner_inconclusive
          elif [ "$PYTEST_OUTCOME" != success ] || [ "$LIFECYCLE_OUTCOME" != success ] || [ "$FRONTEND_OUTCOME" != success ] || [ "$PACKAGE_OUTCOME" != success ] || [ "$SMOKE_OUTCOME" != success ]; then
            STATUS=product_failed
          fi
          python3 - "$EVIDENCE_DIR/results.json" "$STATUS" <<'PY'
          import json, os, subprocess, sys
          payload = {
              'expected_head': os.environ['EXPECTED_HEAD'],
              'actual_head': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'status': sys.argv[2],
              'checks': {
                  'preflight': os.environ['PREFLIGHT_OUTCOME'],
                  'dependencies': os.environ['DEPS_OUTCOME'],
                  'python_regression': os.environ['PYTEST_OUTCOME'],
                  'lifecycle': os.environ['LIFECYCLE_OUTCOME'],
                  'frontend_build': os.environ['FRONTEND_OUTCOME'],
                  'package_build': os.environ['PACKAGE_OUTCOME'],
                  'smoke_selfcheck': os.environ['SMOKE_SELFCHECK_OUTCOME'],
                  'exact_package_d4b_smoke': os.environ['SMOKE_OUTCOME'],
                  'postflight': os.environ['POSTFLIGHT_OUTCOME'],
              },
          }
          with open(sys.argv[1], 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2)
          PY
          {
            echo '# D4-B merged-head verification'
            echo
            echo "Expected head: \`$EXPECTED_HEAD\`"
            echo "Result: **$STATUS**"
            echo
            if [ "$STATUS" = passed ]; then
              echo 'PASS — FULL AUTOMATED SMOKE PASSED'
              echo 'D4-B may proceed to lifecycle closure.'
            elif [ "$STATUS" = product_failed ]; then
              echo 'FAIL — PRODUCT REGRESSION CONFIRMED'
              echo 'Do not close D4-B.'
            else
              echo 'INCONCLUSIVE — SMOKE EVIDENCE IS NOT RELIABLE'
              echo 'Do not close D4-B based on this run.'
            fi
          } > "$EVIDENCE_DIR/D4B_MERGED_SMOKE_REPORT.md"
          cat "$EVIDENCE_DIR/D4B_MERGED_SMOKE_REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          test "$STATUS" = passed
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d4-b-merged-d60a3be9-evidence
          path: ${{ runner.temp }}/d4-b-merged-evidence
          if-no-files-found: error
