      - name: Backend and launcher focused tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile backend/app/services/update_safety.py backend/app/services/settings.py backend/app/schemas/settings.py launcher/runtime.py macos_package/entrypoint.py macos_package/user_alert.py
          python3 -m pytest -q \
            backend/app/tests/test_d4_c_update_status.py \
            backend/app/tests/test_settings.py \
            backend/app/tests/test_settings_api.py \
            launcher/tests/test_d4_c_update_failure_mapping.py \
            macos_package/tests/test_d4_c_update_failure_alerts.py \
            macos_package/tests/test_macos_package_entrypoint.py

      - name: Frontend focused test and build
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run test:settings-update-status
          npm run build

      - name: Existing lifecycle and diff gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_documentation_lifecycle.py
          git diff --check
          test -z "$(git diff --name-only "$EXPECTED_BASE"...HEAD)"
          git diff --check

      - name: Commit implementation only
        shell: bash
        run: |
          set -euo pipefail
          git add \
            backend/app/schemas/settings.py \
            backend/app/services/settings.py \
            backend/app/services/update_safety.py \
            backend/app/tests/test_d4_c_update_status.py \
            launcher/runtime.py \
            launcher/tests/test_d4_c_update_failure_mapping.py \
            macos_package/entrypoint.py \
            macos_package/user_alert.py \
            macos_package/tests/test_d4_c_update_failure_alerts.py \
            frontend/package.json \
            frontend/src/main.ts \
            frontend/src/settings-update-status.ts \
            frontend/test/settings-update-status.test.mjs \
            frontend/tsconfig.test.settings-update-status.json
          git diff --cached --check
          git config user.name 'D4-C implementation builder'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'D4-C add user-facing update status and packaged failure UX'
          git push origin HEAD:"$IMPLEMENTATION_BRANCH"
