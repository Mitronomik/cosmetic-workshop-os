name: PR208 CR-015 lifecycle closure verification

on:
  push:
    branches:
      - verification/pr208-054bbb57

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_BASE: c38940349a80d345f3e833b61e4bf4e5e761c0eb
      EXPECTED_HEAD: 054bbb57b5ad60dbba6aeb244794198c069f84fd
      PR_BRANCH: docs/cr015-lifecycle-closure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
      - name: Verify exact lifecycle-only closure
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$PR_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          test "$(git rev-parse origin/$PR_BRANCH)" = "$EXPECTED_HEAD"
          test "$(git rev-list --count "$EXPECTED_BASE..$EXPECTED_HEAD")" = 1
          test -z "$(git status --porcelain)"
          git diff --check "$EXPECTED_BASE...$EXPECTED_HEAD"
          python3 -m py_compile scripts/check_documentation_lifecycle.py
          python3 scripts/check_documentation_lifecycle.py

          git diff --name-only "$EXPECTED_BASE...$EXPECTED_HEAD" | sort > "$RUNNER_TEMP/changed.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          README.md
          docs/current-lifecycle.md
          docs/decisions/0022-native-macos-application-lifecycle.md
          docs/deployment.md
          docs/implementation-plan.md
          docs/packaging.md
          scripts/check_documentation_lifecycle.py
          state/change-requests.md
          state/current-focus.md
          state/handoff.md
          state/progress.md
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/expected.txt"
          sort -o "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/changed.txt"
          ! grep -E '^(backend/|frontend/|launcher/|macos_package/|migrations/|scripts/macos/app_lifecycle\.m$|scripts/package_macos\.sh$)' "$RUNNER_TEMP/changed.txt"

          # Prove the closure checker pins the exact merged runtime files rather
          # than merely narrating the fix as done.
          grep -Fq 'CR015_VERIFIED_HEAD = "d7f95141e5f41c7a806c3fafb71e942fe5892dd8"' scripts/check_documentation_lifecycle.py
          grep -Fq 'CR015_MERGED_HEAD = "c38940349a80d345f3e833b61e4bf4e5e761c0eb"' scripts/check_documentation_lifecycle.py
          grep -Fq 'CR015_VERIFY_RUN = "31780899805"' scripts/check_documentation_lifecycle.py
          grep -Fq 'CR015_PACKAGE_SHA256 = "85f993a93082c4b3a36771318cf8c0c3abf02be56b1374a32a62d1a6b9279ee6"' scripts/check_documentation_lifecycle.py
          grep -Fq 'D5 — Remote install checklist — BLOCKER FIXED — FRESH HUMAN REHEARSAL REQUIRED' state/current-focus.md
          grep -Fq 'No new runtime implementation slice is authorized now' state/current-focus.md
          grep -Fq 'Product release readiness — NOT CLAIMED' state/current-focus.md
          test -z "$(git status --porcelain)"
          echo 'PASS — CR-015 LIFECYCLE CLOSURE EXACT-HEAD VERIFIED'
