name: Build CR-015 native lifecycle implementation

on:
  push:
    branches:
      - verification/cr015-lifecycle-impl-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      TARGET: fix/d5-native-macos-lifecycle
      BUILDER: verification/cr015-lifecycle-impl-builder
      EXPECTED_BASE: e040011e54d1bc39461c9c01b6caaa568307c0c0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/d5-native-macos-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build test and publish native lifecycle fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET" "$BUILDER"
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          test "$(git rev-parse origin/$TARGET)" = "$EXPECTED_BASE"
          test -z "$(git status --porcelain)"

          git show "origin/$BUILDER:verification/build_cr015_lifecycle_impl.py" > "$RUNNER_TEMP/build_cr015_lifecycle_impl.py"
          python3 -m py_compile "$RUNNER_TEMP/build_cr015_lifecycle_impl.py"
          python3 "$RUNNER_TEMP/build_cr015_lifecycle_impl.py"
          git diff --check

          python3 -m pip install --disable-pip-version-check './backend[test]'
          PYTHONPATH="$PWD/backend:$PWD" python3 -m pytest macos_package/tests -q
          python3 scripts/check_documentation_lifecycle.py

          export COSMETIC_WORKSHOP_BUILD_DIR="$RUNNER_TEMP/cr015-build"
          export COSMETIC_WORKSHOP_PACKAGE_OUTPUT_DIR="$RUNNER_TEMP/cr015-dist"
          export COSMETIC_WORKSHOP_BUILD_CACHE_DIR="$RUNNER_TEMP/cr015-cache"
          bash scripts/package_macos.sh
          test -x "$COSMETIC_WORKSHOP_BUILD_DIR/package/CosmeticWorkshopOS.app/Contents/MacOS/CosmeticWorkshopOS"
          test -x "$COSMETIC_WORKSHOP_BUILD_DIR/package/CosmeticWorkshopOS.app/Contents/MacOS/CosmeticWorkshopOSRuntime"
          file "$COSMETIC_WORKSHOP_BUILD_DIR/package/CosmeticWorkshopOS.app/Contents/MacOS/CosmeticWorkshopOS" | grep -q 'Mach-O'
          python3 scripts/verify_macos_package.py \
            --app "$COSMETIC_WORKSHOP_BUILD_DIR/package/CosmeticWorkshopOS.app" \
            --zip "$COSMETIC_WORKSHOP_PACKAGE_OUTPUT_DIR/CosmeticWorkshopOS-mac.zip" \
            --source-root "$PWD"

          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > "$RUNNER_TEMP/changed.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          macos_package/tests/packaging_fixtures.py
          macos_package/tests/test_macos_package_structure.py
          macos_package/tests/test_native_macos_lifecycle_source.py
          macos_package/verification.py
          scripts/macos/app_lifecycle.m
          scripts/package_macos.sh
          EOF
          sed -i '' 's/^          //' "$RUNNER_TEMP/expected.txt"
          sort -o "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/changed.txt"
          ! grep -E '^(backend/|frontend/|launcher/|migrations/)' "$RUNNER_TEMP/changed.txt"

          git add \
            macos_package/tests/packaging_fixtures.py \
            macos_package/tests/test_macos_package_structure.py \
            macos_package/tests/test_native_macos_lifecycle_source.py \
            macos_package/verification.py \
            scripts/macos/app_lifecycle.m \
            scripts/package_macos.sh
          git diff --cached --check
          test -z "$(git status --porcelain | grep '^??' || true)"
          git config user.name 'CR-015 lifecycle builder'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Fix native macOS application lifecycle for D5'
          git push origin HEAD:"$TARGET"
